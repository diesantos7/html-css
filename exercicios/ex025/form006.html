<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
</head>
<body>
  <h1>Exemplo de Formulário</h1>
  <form action="cadastro.php" method="post">
    <p>
      <label for="icor">Cor</label>
      <input type="color" name="cor" id="icor" value="#00ff00">
    </p>
    <p>
      <label for="inivel">Nivel de Sastifação</label>
      <input type="range" name="nivel" id="inivel" min="1" max="20" value="5">
    </p>
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>
    <p>
      <label for="ifoto">Foto de perfil:</label>
      <input type="file" name="foto" id="ifoto">
    </p>
  </form>
</body>
</html>
