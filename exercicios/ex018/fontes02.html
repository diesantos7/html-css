<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fontes externas</title>
  <style>
    @font-face {
      font-family: 'Blackrush';
      src: url(fonts/Blackrush.ttf) format(truetype);
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 {
      font-family: 'Blackrush', Times, serif;
      font-weight: normal;
      font-size: 3em;
    }
  </style>
</head>
<body>
  <h1>Título</h1>
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur temporibus, vitae quibusdam esse unde nemo facilis est voluptates. Alias quia nesciunt enim delectus autem? Quisquam iste reprehenderit ut tempora et.</p>
</body>
</html>
