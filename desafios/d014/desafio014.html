<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio-14</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    table {
      border-collapse: collapse;
    }
    caption {
      font-size: 1.3em;
      font-weight: bold;
      padding: 10px;
    }
    th, td {
      border: 1px solid black;
      padding: 5px 10px;
    }
    .thGray {
      background-color: gray;
      color: white;
      text-align: left;
    }
    .notas {
      text-align: center;
    }
  </style>
</head>

      <tr>

      </tr>
      <tr>
        <td>Biologia</td>
        <td>0.0</td>

        <td>0.0</td>
      </tr>
      <tr class="thGray">
        <th colspan="4" scope="row">Média de Exatas</th>
        <td>0.0</td>
      </tr>
      <tr>
        <th rowspan="2" scope="rowgroup">Humas</th>
        <td>Historia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Geografia</td>
